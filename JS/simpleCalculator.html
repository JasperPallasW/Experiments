<html>
    <body>
        <input type="text" id="val1" placeholder="Value 1">
        <input type="text" id="val2" placeholder="Value 2">
        <button id="btn" onclick="add()">+</button>
        <button id="btn" onclick="sub()">-</button>
        <button id="btn" onclick="mul()">x</button>
        <button id="btn" onclick="div()">/</button>
        <div id="output"></div>
    </body>
</html>

<script>
    function add(){
        var val1= document.getElementById('val1').value;
        var val2= document.getElementById('val2').value;

        document.getElementById("output").innerText=(Number(val1)+Number(val2));
    }
    function sub(){
        var val1= document.getElementById('val1').value;
        var val2= document.getElementById('val2').value;

        document.getElementById("output").innerText=(Number(val1)-Number(val2));
    }
    function mul(){
        var val1= document.getElementById('val1').value;
        var val2= document.getElementById('val2').value;

        document.getElementById("output").innerText=(Number(val1)*Number(val2));
    }
    function div(){
        var val1= document.getElementById('val1').value;
        var val2= document.getElementById('val2').value;

        document.getElementById("output").innerText=(Number(val1)/Number(val2));
    }
</script>
